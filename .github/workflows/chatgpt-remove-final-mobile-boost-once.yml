name: Remove final mobile zoom boost

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/chatgpt-remove-final-mobile-boost-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Remove 90-100 mobile boost
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('src/App.jsx')
          text = app.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '''  // Boost aggiuntivo solo mobile, applicato a prodotti e designer solo\n  // nell'ultimo tratto di zoom (da boost_soglia a 1): non tocca il resto della curva.\n  boost_mobile_max: 2.7,\n  boost_soglia: 0.9,\n''',
              '',
              'final boost constants'
          )

          boost_block = '''        if (isMobile && t > STILE.boost_soglia) {\n          const tBoost = (t - STILE.boost_soglia) / (1 - STILE.boost_soglia)\n          base *= lerp(1, STILE.boost_mobile_max, tBoost)\n        }\n'''
          count = text.count(boost_block)
          if count != 2:
              raise SystemExit(f'final boost blocks: expected 2 matches, found {count}')
          text = text.replace(boost_block, '', 2)

          app.write_text(text)

          handoff = Path('HANDOFF.md')
          h = handoff.read_text()
          marker = '## Rimosso boost finale mobile 90-100% (2026-09-06)'
          if marker not in h:
              h += '\n\n' + marker + '\n\n- Rimosso il boost mobile aggiuntivo nell’ultimo 10% dello zoom (`boost_soglia: 0.9` / `boost_mobile_max: 2.7`) per designer e prodotti.\n- Resta il moltiplicatore mobile uniforme `SCALA_MOBILE_NODI_LABEL = 1.5` a tutti i livelli di zoom.\n- Il boost medio 15%-80% usato solo per l’etichetta designer resta invariato.\n'
              handoff.write_text(h)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Guard protected layout and zoom constants
        run: |
          BASE=$(git rev-parse HEAD^)
          if git diff "$BASE" -- src/App.jsx | grep -E '^[-+].*(zoom_designer_min:|zoom_designer_max:|zoom_prodotto_min:|zoom_prodotto_max:|designer_size:|prodotto_size:|orbita_raggio_base:|orbita_soglia_prodotti:|orbita_spazio_per_prodotto:|orbita_scala_mobile:|eta_raggio_base:|eta_riferimento:|eta_massima:|eta_unita_per_anno:|designer_scala_secondario:|function separaPosizioniSovrapposte)'; then
            echo 'Protected layout/zoom code changed unexpectedly.'
            exit 1
          fi

      - name: Commit and push
        run: |
          rm .github/workflows/chatgpt-remove-final-mobile-boost-once.yml
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx HANDOFF.md .github/workflows/chatgpt-remove-final-mobile-boost-once.yml
          git commit -m "Rimuove boost finale mobile 90-100"
          git push origin main
