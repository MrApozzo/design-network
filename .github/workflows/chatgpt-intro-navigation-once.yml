name: Update intro navigation logic

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/chatgpt-intro-navigation-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Patch intro navigation logic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          app = Path('src/App.jsx')
          text = app.read_text()
          pattern = r'  const \[primaVisita\] = useState\(\(\) => \{\n.*?  const \[schermataIniziale, setSchermataIniziale\] = useState\(primaVisita\)\n'
          lines = [
              '  const [mostraIntroAllAvvio] = useState(() => {',
              "    // L'intro dipende dal tipo di apertura, non dal tempo trascorso:",
              '    // refresh/ricarica della pagina -> non mostrarla;',
              '    // nuova navigazione (URL digitato, link, nuova tab) -> mostrarla.',
              '    try {',
              '      const navigazione = performance.getEntriesByType?.("navigation")?.[0]',
              '      if (navigazione?.type) return navigazione.type !== "reload"',
              '      if (performance.navigation) return performance.navigation.type !== 1',
              '    } catch {}',
              '    return true',
              '  })',
              '  const [schermataIniziale, setSchermataIniziale] = useState(mostraIntroAllAvvio)',
          ]
          replacement = '\n'.join(lines) + '\n'
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected one intro startup block, found {count}')
          app.write_text(text)
          handoff = Path('HANDOFF.md')
          h = handoff.read_text()
          marker = '## Logica apertura intro basata sulla navigazione (2026-09-06)'
          if marker not in h:
              h += "\n\n## Logica apertura intro basata sulla navigazione (2026-09-06)\n\n- Rimossa la vecchia regola temporale dei 3,5 giorni e la dipendenza da `dn-camera`.\n- L'intro si apre su una nuova navigazione (URL digitato, link, nuova tab) e non si apre su refresh/reload della pagina.\n- Fallback compatibile con `performance.navigation` per browser meno recenti.\n"
              handoff.write_text(h)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Guard layout and zoom code
        run: |
          if git diff -- src/App.jsx | grep -E '^[-+].*(zoom_|designer_size|prodotto_size|orbita_|raggioBase|separaPosizioniSovrapposte)'; then
            echo 'Protected layout/zoom code changed unexpectedly.'
            exit 1
          fi

      - name: Commit and push
        run: |
          git config user.name 'ChatGPT'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/chatgpt-intro-navigation-once.yml
          git add src/App.jsx HANDOFF.md .github/workflows/chatgpt-intro-navigation-once.yml
          git commit -m 'Mostra intro sulle nuove navigazioni, non al refresh'
          git push origin main
