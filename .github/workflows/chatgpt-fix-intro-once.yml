name: Fix intro and initial suggestions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-fix-intro-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Patch App.jsx and handoff
        shell: python
        run: |
          from pathlib import Path

          app_path = Path('src/App.jsx')
          text = app_path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '  const [schermataIniziale, setSchermataIniziale] = useState(primaVisita)\n  const [immaginiPronte, setImmaginiPronte] = useState(false)\n  const [rispostaDesigner, setRispostaDesigner] = useState("")\n',
              '  const [schermataIniziale, setSchermataIniziale] = useState(primaVisita)\n  const [rispostaDesigner, setRispostaDesigner] = useState("")\n',
              'remove immaginiPronte state',
          )

          replace_once(
              '\n  useEffect(() => {\n    if (immaginiPronte) setSchermataIniziale(false)\n  }, [immaginiPronte])\n\n  function confermaSchermataIniziale(nomeScelto) {\n',
              '\n  function confermaSchermataIniziale(nomeScelto) {\n',
              'remove auto-close effect',
          )

          replace_once(
              '// onSoglia scatta dopo le prime `sogliaPronte` immagini (le più vicine al centro\n// iniziale, essendo `paths` già ordinato per distanza): serve a sbloccare la\n// schermata iniziale senza aspettare tutto il catalogo, che con centinaia di\n// foto renderebbe l\'avvio molto più lento del necessario. Il resto continua a\n// caricare in background verso onDone.\n',
              '// `sogliaPronte`/`onSoglia` permettono opzionalmente di segnalare quando un\n// primo lotto di immagini è pronto. Il preload continua comunque in background;\n// questa soglia non controlla più la schermata iniziale, che resta visibile fino\n// a quando l\'utente sceglie esplicitamente di entrare nella mappa.\n',
              'update preload comment',
          )

          replace_once(
              '    // Anche il lotto prioritario può essere lento su reti scadenti: un timeout\n    // di sicurezza mostra comunque la mappa entro un tempo massimo, coi\n    // pallini non ancora caricati che restano sul colore di base finché la\n    // loro immagine arriva (il disegno li gestisce già così).\n    let immaginiGiaPronte = false\n    const segnalaPronte = () => {\n      if (immaginiGiaPronte) return\n      immaginiGiaPronte = true\n      setImmaginiPronte(true)\n    }\n    const timeoutPronte = setTimeout(segnalaPronte, 1200)\n    imgCache = preloadImages(imgPaths, 6, undefined, 12, segnalaPronte, () => richiediDisegnoOverlay(2), distanzaDaCameraAttuale)\n',
              '    // Il preload resta completamente indipendente dall\'intro: le immagini vicine\n    // alla camera arrivano per prime e il resto continua in background, ma il\n    // completamento del primo lotto non può più far entrare automaticamente nella mappa.\n    imgCache = preloadImages(imgPaths, 6, undefined, undefined, undefined, () => richiediDisegnoOverlay(2), distanzaDaCameraAttuale)\n',
              'decouple preload from intro',
          )

          replace_once(
              '      resizeObserver.disconnect()\n      clearTimeout(timeoutPronte)\n      if (overlayAnimationFrame !== null) cancelAnimationFrame(overlayAnimationFrame)\n',
              '      resizeObserver.disconnect()\n      if (overlayAnimationFrame !== null) cancelAnimationFrame(overlayAnimationFrame)\n',
              'remove preload timeout cleanup',
          )

          replace_once(
              '  const suggerimentiBenvenuto = rispostaDesigner.trim().length > 1\n    ? cercaEntita(rispostaDesigner).filter((r) => r.tipo === "designer")\n    : []\n',
              '  const queryBenvenuto = rispostaDesigner.trim()\n  const suggerimentiDefaultBenvenuto = ["Achille Castiglioni", "Ettore Sottsass"]\n    .filter((nome) => designers.some((d) => d.nome === nome))\n    .map((nome) => ({ tipo: "designer", nome }))\n  const suggerimentiBenvenuto = queryBenvenuto.length === 0\n    ? suggerimentiDefaultBenvenuto\n    : queryBenvenuto.length > 1\n      ? cercaEntita(queryBenvenuto).filter((r) => r.tipo === "designer")\n      : []\n',
              'add default intro suggestions',
          )

          app_path.write_text(text)

          handoff = Path('HANDOFF.md')
          h = handoff.read_text()
          marker = '## Fix intro e suggerimenti iniziali (2026-09-06)'
          if marker not in h:
              h += f'''\n\n{marker}\n\n- Corretto il bug per cui la schermata iniziale si chiudeva automaticamente appena il preload raggiungeva 12 immagini o il timeout di 1,2 s: il preload ora è indipendente dall'intro.\n- La schermata iniziale resta visibile fino a `confermaSchermataIniziale()`, quindi solo dopo un'azione esplicita dell'utente.\n- Quando compare il campo della domanda iniziale, a input vuoto vengono mostrati due suggerimenti cliccabili (`Achille Castiglioni`, `Ettore Sottsass`); dopo almeno 2 caratteri torna l'autocomplete normale del database.\n'''
              handoff.write_text(h)

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify protected constants were not touched
        shell: bash
        run: |
          if git diff -- src/App.jsx | grep -E '^[-+].*(zoom_designer_min|zoom_designer_max|designer_size|prodotto_size|orbita_|raggioBase|separaPosizioniSovrapposte|designer_scala_secondario)'; then
            echo 'Protected constants/functions changed unexpectedly.'
            exit 1
          fi

      - name: Commit patch and remove one-off workflow
        shell: bash
        run: |
          git config user.name 'ChatGPT'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/chatgpt-fix-intro-once.yml
          git add src/App.jsx HANDOFF.md .github/workflows/chatgpt-fix-intro-once.yml
          git commit -m 'Corregge intro e aggiunge suggerimenti iniziali'
          git push origin main
