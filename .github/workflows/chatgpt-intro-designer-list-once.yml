name: Update intro designer list

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-intro-designer-list-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Patch intro designer list
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path('src/App.jsx')
          text = app.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '    benvenutoConferma: "Entra",\n',
              '    benvenutoConferma: "Entra",\n    benvenutoCercaLabel: "cerca",\n',
              'Italian search label',
          )
          replace_once(
              '    benvenutoConferma: "Enter",\n',
              '    benvenutoConferma: "Enter",\n    benvenutoCercaLabel: "search",\n',
              'English search label',
          )

          pattern = r'''  const queryBenvenuto = rispostaDesigner\.trim\(\)\n  const suggerimentiDefaultBenvenuto = \["Achille Castiglioni", "Ettore Sottsass"\]\n    \.filter\(\(nome\) => designers\.some\(\(d\) => d\.nome === nome\)\)\n    \.map\(\(nome\) => \(\{ tipo: "designer", nome \}\)\)\n  const suggerimentiBenvenuto = queryBenvenuto\.length === 0\n    \? suggerimentiDefaultBenvenuto\n    : queryBenvenuto\.length > 1\n      \? cercaEntita\(queryBenvenuto\)\.filter\(\(r\) => r\.tipo === "designer"\)\n      : \[\]\n'''
          replacement = '''  const queryBenvenuto = rispostaDesigner.trim().toLowerCase()\n  const designersBenvenuto = [...designers].sort((a, b) => {\n    const differenzaProdotti = (CONTEGGIO_PRODOTTI_PER_DESIGNER.get(b.nome) ?? 0)\n      - (CONTEGGIO_PRODOTTI_PER_DESIGNER.get(a.nome) ?? 0)\n    return differenzaProdotti || a.nome.localeCompare(b.nome)\n  })\n  const suggerimentiBenvenuto = designersBenvenuto\n    .filter((d) => !queryBenvenuto || d.nome.toLowerCase().includes(queryBenvenuto))\n    .map((d) => ({ tipo: "designer", nome: d.nome }))\n'''
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'designer suggestions block: expected 1 match, found {count}')

          replace_once(
              '            <div style={{ position: "relative", width: "100%", maxWidth: 260 }}>\n              <input\n                ref={inputSchermataInizialeRef}\n',
              '            <div style={{ position: "relative", width: "100%", maxWidth: 260 }}>\n              <label htmlFor="dn-benvenuto-cerca" style={{\n                position: "absolute", top: -6, left: 14, zIndex: 2, padding: "0 5px",\n                background: "white", fontSize: 9, lineHeight: "12px", color: "#777",\n                fontFamily: "Roboto, sans-serif", letterSpacing: "0.02em", pointerEvents: "none",\n              }}>\n                {t.benvenutoCercaLabel}\n              </label>\n              <input\n                id="dn-benvenuto-cerca"\n                ref={inputSchermataInizialeRef}\n',
              'intro search label',
          )

          replace_once(
              '                <ListaConScroll maxHeight={220}\n                  wrapperStyle={{ position: "absolute", top: "100%", left: 0, right: 0, marginTop: 6, zIndex: 10 }}\n',
              '                <ListaConScroll maxHeight={112}\n                  wrapperStyle={{ position: "absolute", top: "100%", left: 0, right: 0, marginTop: 6, zIndex: 10 }}\n',
              'intro list height',
          )

          app.write_text(text)

          handoff = Path('HANDOFF.md')
          h = handoff.read_text()
          marker = '## Lista completa designer nella domanda iniziale (2026-09-06)'
          if marker not in h:
              h += '\n\n' + marker + '\n\n- A input vuoto, il dropdown iniziale mostra tutti i designer ordinati per numero di prodotti presenti nel database (decrescente; parità alfabetica).\n- Digitando, la stessa lista viene filtrata per nome mantenendo l’ordinamento per quantità di prodotti.\n- Altezza del dropdown ridotta a circa 3,5 righe (`maxHeight={112}`) e scrollbar custom `ListaConScroll`, così è evidente che la lista è scorrevole.\n- Aggiunta etichetta flottante `cerca`/`search` sul campo iniziale.\n'
              handoff.write_text(h)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Guard protected layout and zoom code
        run: |
          if git diff -- src/App.jsx | grep -E '^[-+].*(zoom_designer_min|zoom_designer_max|designer_size|prodotto_size|orbita_|raggioBase|separaPosizioniSovrapposte|designer_scala_secondario)'; then
            echo 'Protected layout/zoom code changed unexpectedly.'
            exit 1
          fi

      - name: Commit and push
        run: |
          git config user.name 'ChatGPT'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/chatgpt-intro-designer-list-once.yml
          git add src/App.jsx HANDOFF.md .github/workflows/chatgpt-intro-designer-list-once.yml
          git commit -m 'Mostra tutti i designer nella ricerca iniziale'
          git push origin main
